[package]
name = "vnkey"
version = "0.2.1"
description = "VNKey - Vietnamese input method for macOS"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
dirs = "6.0"
vnkey-engine = { path = "../vnkey-engine" }

[target.'cfg(target_os = "macos")'.dependencies]
gpui-kit = "0.10.0"
# The status-bar item + its menu. Same crates Tauri used internally, now
# driven directly since GPUI has no tray API.
tray-icon = "0.24"
futures = "0.3"
parking_lot = "0.12"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSNotification", "NSOperation", "NSUserDefaults", "NSData", "NSAttributedString", "block2"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSGraphics", "NSEvent", "NSPasteboard", "objc2-core-graphics", "NSFont", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSResponder", "NSAttributedString"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFRunLoop", "CFMachPort", "CFDictionary", "CFNumber"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
