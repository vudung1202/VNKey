<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VNKey</title>
    <!-- Resolve the theme before first paint to avoid a flash: prefer the last
         applied theme (written by lib/theme.ts), else follow the OS. lib/theme.ts
         then reconciles this with the persisted user preference once React loads. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("vnkey-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
