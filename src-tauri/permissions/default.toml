# ACL for VNKey's own IPC commands (Task 12: tray/commands/events/pasteboard).
#
# Tauri v2 denies any command with no matching entry in a capability's
# resolved `allowed_commands` (`RuntimeAuthority::resolve_access`) -- app-own
# commands are not exempt, they need a permission like any plugin's. Since
# `build.rs` calls plain `tauri_build::build()` (no `AppManifest::commands`),
# nothing is autogenerated; this file is picked up because
# `src-tauri/permissions/**/*` is scanned by default. Referenced as the
# unprefixed `"default"` entry in `capabilities/default.json` (no `plugin:`
# prefix resolves to the app's own manifest, per `APP_ACL_KEY`).

[[permission]]
identifier = "allow-app-commands"
description = "Allow all of VNKey's own IPC commands (settings, macros, clipboard, tray, updates)."
commands.allow = [
  "get_settings",
  "set_settings",
  "set_language",
  "set_input_type",
  "set_code_table",
  "set_switch_hotkey",
  "set_convert_hotkey",
  "restore_default_settings",
  "macro_list",
  "macro_add",
  "macro_delete",
  "macro_import",
  "macro_export",
  "convert_clipboard",
  "read_clipboard",
  "write_clipboard",
  "get_permission_status",
  "open_accessibility_settings",
  "restart_app",
  "has_openkey_data",
  "import_openkey_settings",
  "check_update",
  "quit_app",
  "set_hotkey_recording",
]

[default]
description = "Default permissions for VNKey's own IPC commands."
permissions = ["allow-app-commands"]
